    <!-- Chrome fires beforeinstallprompt long before the React bundle parses, so
         the InstallAppButton's useEffect listener always missed it and fell back
         to the iOS "Add to Home Screen" modal. Catch it here and stash it. -->
    <script>
      window.__pfInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pfInstallPrompt = e;
        window.dispatchEvent(new Event('pf-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pfInstallPrompt = null;
      });
    </script>
